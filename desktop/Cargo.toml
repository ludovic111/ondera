[package]
name = "ondera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ondera"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
tokio = { version = "1", features = ["sync"] }
ondera-engine = { path = "../engine" }
serde_json.workspace = true
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
wgpu = { version = "25", default-features = false, features = ["metal", "dx12", "vulkan", "gles", "wgsl"] }
# Keep Cargo.lock: gpu-allocator's broad Windows range must resolve to 0.58 for wgpu,
# separately from CPAL's Windows 0.54 bindings. CI checks the actual Windows build.
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
ondera-plugin = { path = "../sdk" }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "ondera"
path = "src/main.rs"

[dev-dependencies]
ondera-tools = { path = "../tools" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication"] }
objc2-foundation = "0.3"
