[package]
name = "ondera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ondera"

[dependencies]
ondera-engine = { path = "../engine" }
serde_json.workspace = true
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
wgpu = { version = "25", default-features = false, features = ["metal", "dx12", "vulkan", "gles", "wgsl"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "ondera"
path = "src/main.rs"
