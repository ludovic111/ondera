<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ryolune's app icon, from the lsuite template (lsuite design/DESIGN.md, "App icons"):
       the macOS grid's 824 px squircle in the app's 300 → 600 → 800 teal, a white ring and
       dot at 58 % of the tile with a soft shadow, and a glass sheen over the top half. -->
  <defs>
    <linearGradient id="tile" x1="0.16" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#37d8c9"/>
      <stop offset="0.7" stop-color="#009586"/>
      <stop offset="1" stop-color="#00584f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glyph" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="184.3"/></clipPath>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="184.3" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <rect x="100.5" y="100.5" width="823" height="823" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <!-- The ring and the dot (lsuite's 32-unit glyph) at 478 px. -->
  <g filter="url(#glyph)">
    <g transform="translate(273 273) scale(14.9375)">
      <circle cx="16" cy="16" r="11" fill="none" stroke="#ffffff" stroke-width="5"/>
      <circle cx="16" cy="16" r="3.4" fill="#ffffff"/>
    </g>
  </g>
</svg>
