name: Release
# Builds every platform from a `vX.Y.Z` tag and publishes a GitHub release with one asset per
# platform plus SHA256SUMS. The desktop app reads that release to update itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release publication guards
        run: python3 scripts/tests/release_workflow.py
      - name: Verify immutable tag, version and release notes
        run: bash scripts/verify-release.sh

  build:
    needs: verify
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            asset: Ondera-macos-arm64.zip
            archive: Ondera-macos-arm64.zip
          - os: macos-15-intel
            asset: Ondera-macos-x86_64.zip
            archive: Ondera-macos-x86_64.zip
          - os: ubuntu-22.04
            asset: ondera-linux-x86_64
            archive: Ondera-linux-x86_64.zip
          - os: windows-latest
            asset: ondera-windows-x86_64.exe
            archive: Ondera-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bound Linux compiler memory
        if: runner.os == 'Linux'
        run: |
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 15
      - run: cargo build --release --locked --workspace
      - name: Complete song through MCP and CLI
        run: python3 scripts/verify-song.py
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/ondera dist/${{ matrix.asset }}
          tar -czf dist/Ondera-linux-x86_64.tar.gz -C target/release ondera ondera-cli ondera-mcp
          python3 scripts/package-portable.py linux target/release dist/Ondera-linux-x86_64.zip
          python3 scripts/package-portable.py demo artifacts/song-verification dist/Ondera-Afterglow-demo.zip
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ondera.exe dist/${{ matrix.asset }}
          python scripts/package-portable.py windows target/release dist/Ondera-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.archive }}
          if-no-files-found: error
      - name: Upload Linux tar and stock demo
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-and-stock-demo
          path: |
            dist/Ondera-linux-x86_64.tar.gz
            dist/Ondera-Afterglow-demo.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Ondera-macos-arm64.zip Ondera-macos-x86_64.zip Ondera-linux-x86_64.zip Ondera-linux-x86_64.tar.gz Ondera-windows-x86_64.zip ondera-linux-x86_64 ondera-windows-x86_64.exe Ondera-Afterglow-demo.zip > SHA256SUMS
      - name: Publish complete draft or verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
