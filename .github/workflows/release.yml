name: Release
# Builds every platform from a `vX.Y.Z` tag and publishes a GitHub release with one asset per
# platform plus SHA256SUMS. The desktop app reads that release to update itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release publication guards
        run: python3 scripts/tests/release_workflow.py
      - name: Verify immutable tag, version and release notes
        run: bash scripts/verify-release.sh

  build:
    needs: verify
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            asset: ryolune-macos-arm64.zip
            archive: ryolune-macos-arm64.zip
          - os: macos-15-intel
            asset: ryolune-macos-x86_64.zip
            archive: ryolune-macos-x86_64.zip
          - os: ubuntu-22.04
            asset: ryolune-linux-x86_64
            archive: ryolune-linux-x86_64.zip
          - os: windows-latest
            asset: ryolune-windows-x86_64.exe
            archive: ryolune-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - name: Bound Linux compiler memory
        if: runner.os == 'Linux'
        run: |
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 15
      - run: cargo build --release --locked --workspace
      - name: Complete song through MCP and CLI
        run: python3 scripts/verify-song.py
      - name: Prepare Developer ID signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/prepare-apple-signing.sh
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/ryolune dist/${{ matrix.asset }}
          tar -czf dist/ryolune-linux-x86_64.tar.gz -C target/release ryolune ryolune-cli ryolune-mcp
          python3 scripts/package-portable.py linux target/release dist/ryolune-linux-x86_64.zip
          python3 scripts/package-portable.py demo artifacts/song-verification dist/ryolune-Afterglow-demo.zip
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ryolune.exe dist/${{ matrix.asset }}
          python scripts/package-portable.py windows target/release dist/ryolune-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.archive }}
          if-no-files-found: error
      - name: Upload Linux tar and stock demo
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-and-stock-demo
          path: |
            dist/ryolune-linux-x86_64.tar.gz
            dist/ryolune-Afterglow-demo.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ryolune-macos-arm64.zip ryolune-macos-x86_64.zip ryolune-linux-x86_64.zip ryolune-linux-x86_64.tar.gz ryolune-windows-x86_64.zip ryolune-linux-x86_64 ryolune-windows-x86_64.exe ryolune-Afterglow-demo.zip > SHA256SUMS
      - name: Install signing binary runtime
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libasound2 libudev1 libxkbcommon0 libegl1 libgl1 libxdo3 libayatana-appindicator3-1
      - name: Sign checksums
        env:
          RYOLUNE_SIGNING_KEY: ${{ secrets.ONDERA_SIGNING_KEY }}
        run: |
          if [ -z "$RYOLUNE_SIGNING_KEY" ]; then
            echo 'The RYOLUNE_SIGNING_KEY secret is not set. Installed apps refuse unsigned releases; add the secret from the key generated with `ryolune --release-keygen`.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RYOLUNE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          chmod +x dist/ryolune-linux-x86_64
          dist/ryolune-linux-x86_64 --sign-release "$RUNNER_TEMP/release.key" dist/SHA256SUMS
          dist/ryolune-linux-x86_64 --verify-release dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release.key"
      - name: Publish complete draft or verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
